<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= htmlWebpackPlugin.options.title %> Options</title>
    <script type="module" src="browser-polyfill.js"></script>
  </head>

  <body>
    <div class="container">
      <header class="options-header">
        <h1 class="options-title">FoE-Info Settings</h1>
        <button type="button" class="btn-save" id="save">Save</button>
      </header>

      <div id="status" class="save-status" aria-live="polite"></div>

      <!-- City Info -->
      <section class="settings-card">
        <h2 class="settings-card-header">City Info</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show Your City Stats</span>
            <input type="checkbox" id="Stats" />
          </label>
          <label class="toggle-row">
            <span>Show Current Bonus / Boosts</span>
            <input type="checkbox" id="bonus" />
          </label>
          <label class="toggle-row">
            <span>Show City Incidents</span>
            <input type="checkbox" id="Incidents" />
          </label>
          <label class="toggle-row">
            <span>Show Building Collection Times</span>
            <input type="checkbox" id="collectionTimes" />
          </label>
          <label class="toggle-row">
            <span>Show Other Player Stats</span>
            <input type="checkbox" id="visit" />
          </label>
        </div>
      </section>

      <!-- GB Info -->
      <section class="settings-card">
        <h2 class="settings-card-header">Great Buildings</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show GB Donation Helper</span>
            <input type="checkbox" id="Donation" />
          </label>
          <label class="toggle-row">
            <span>Prefix with Guild #</span>
            <input type="checkbox" id="donationGuildPosition" />
          </label>
          <label class="toggle-row">
            <span>Hide Unsafe Spots</span>
            <input type="checkbox" id="hideUnsafe" />
          </label>
          <label class="toggle-row">
            <span>Show GB Rewards</span>
            <input type="checkbox" id="GBRewards" />
          </label>
          <label class="toggle-row">
            <span>Show Current Donors</span>
            <input type="checkbox" id="GBDonors" />
          </label>
          <label class="toggle-row">
            <span>Show Total FP Invested</span>
            <input type="checkbox" id="Invested" />
          </label>
          <label class="toggle-row">
            <span>Show Current Level</span>
            <input type="checkbox" id="GBInfo" />
          </label>
          <label class="field-row">
            <span>Donation %</span>
            <input class="field-input field-input--narrow" type="number" id="donationPercent" value="190" min="0" max="200" />
          </label>
          <label class="field-row">
            <span>Suffix with this text</span>
            <input type="text" class="field-input" id="donationSuffix" value="" size="20" />
          </label>
        </div>
      </section>

      <!-- GvG -->
      <section class="settings-card">
        <h2 class="settings-card-header">GvG</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show GvG Age Status</span>
            <input type="checkbox" id="GvG" />
          </label>
          <label class="toggle-row">
            <span>Show Army Stats</span>
            <input type="checkbox" id="army" />
          </label>
        </div>
      </section>

      <!-- Guild Battlegrounds -->
      <section class="settings-card">
        <h2 class="settings-card-header">Guild Battlegrounds</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show Member Activity</span>
            <input type="checkbox" id="Battleground" />
          </label>
          <label class="toggle-row">
            <span>Show Leaderboard</span>
            <input type="checkbox" id="leaderboard" />
          </label>
          <label class="toggle-row">
            <span>Show Building Costs</span>
            <input type="checkbox" id="buildingCosts" />
          </label>
          <label class="toggle-row">
            <span>Show Rewards</span>
            <input type="checkbox" id="GBGrewards" />
          </label>
          <label class="toggle-row">
            <span>Show # Siege Camps</span>
            <input type="checkbox" id="GBGshowSC" />
          </label>
          <label class="toggle-row">
            <span>Show Province Opening Time</span>
            <input type="checkbox" id="GBGprovinceTime" />
          </label>
          <label class="field-row">
            <span>Add text to target generator</span>
            <input type="text" class="field-input" id="targetText" value="" size="40" />
          </label>
          <label class="field-row">
            <span>Search message topics for targets</span>
            <input type="text" class="field-input" id="targets" value="targets" size="40" />
          </label>
        </div>
      </section>

      <!-- Guild Expedition -->
      <section class="settings-card">
        <h2 class="settings-card-header">Guild Expedition</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show Member Contribution</span>
            <input type="checkbox" id="Expedition" />
          </label>
          <label class="toggle-row">
            <span>Show Rewards</span>
            <input type="checkbox" id="GErewards" />
          </label>
        </div>
      </section>

      <!-- Other Info -->
      <section class="settings-card">
        <h2 class="settings-card-header">Other Info</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show Cultural Settlement</span>
            <input type="checkbox" id="settlement" />
          </label>
          <label class="toggle-row">
            <span>Show Rewards</span>
            <input type="checkbox" id="rewards" />
          </label>
          <label class="toggle-row">
            <span>Show Goods Inventory</span>
            <input type="checkbox" id="goods" />
          </label>
        </div>
      </section>

      <!-- Player Lists -->
      <section class="settings-card">
        <h2 class="settings-card-header">Player Lists on Launch</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show Friends</span>
            <input type="checkbox" id="Friends" />
          </label>
          <label class="toggle-row">
            <span>Show Guild</span>
            <input type="checkbox" id="Guild" />
          </label>
          <label class="toggle-row">
            <span>Show Hood</span>
            <input type="checkbox" id="Hood" />
          </label>
        </div>
      </section>

      <!-- Guild Admin -->
      <section class="settings-card">
        <h2 class="settings-card-header">Guild Admin</h2>
        <div class="settings-card-body">
          <label class="toggle-row">
            <span>Show Treasury</span>
            <input type="checkbox" id="Treasury" />
          </label>
          <label class="toggle-row">
            <span>Show Treasury Contributions</span>
            <input type="checkbox" id="contributions" />
          </label>
          <label class="toggle-row">
            <span>Show Treasury Logs</span>
            <input type="checkbox" id="logs" />
          </label>
        </div>
      </section>

      <!-- Integrations -->
      <section class="settings-card" id="urlDiv">
        <h2 class="settings-card-header">Integrations</h2>
        <div class="settings-card-body">
          <label class="field-row">
            <span>Discord Webhook URL — GBG Targets</span>
            <input type="url" class="field-input" id="discordTargetURL" value="" size="40" pattern="https?://.+" />
          </label>
          <label class="field-row">
            <span>Google Sheet URL — Guild Info</span>
            <input
              type="url"
              class="field-input"
              id="sheetGuildURL"
              value=""
              size="40"
              placeholder="https://script.google.com/macros/s/.../exec"
              pattern="https://script\.google\.com/macros/s/.+/exec.*"
              title="Must be a Google Apps Script Web App URL: https://script.google.com/macros/s/.../exec"
            />
            <small id="sheetGuildURL-hint" class="field-hint" style="display:none"></small>
          </label>
          <label class="field-row">
            <span>Forge Companion Import URL — GBG</span>
            <input type="url" class="field-input" id="forgeCompanionURL" value="" size="40" pattern="https?://.+" />
          </label>
        </div>
      </section>

      <!-- Appearance -->
      <section class="settings-card">
        <h2 class="settings-card-header">Appearance</h2>
        <div class="settings-card-body">
          <label class="field-row">
            <span>Language</span>
            <select class="field-select" id="language" name="language">
              <option value="auto">Use Browser Language</option>
              <option value="en">English</option>
              <option value="nl">Dutch</option>
              <option value="fi">Finnish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="el">Greek</option>
              <option value="it">Italian</option>
              <option value="es">Spanish</option>
              <option value="sv">Swedish</option>
              <option value="game">Use Game Language</option>
            </select>
          </label>
          <label class="field-row">
            <span>UI Mode</span>
            <select class="field-select" id="uiMode" name="uiMode">
              <option value="classic">Classic</option>
              <option value="traditional">Traditional</option>
            </select>
          </label>
          <label class="field-row">
            <span>Theme</span>
            <select class="field-select" id="theme" name="theme">
              <option value="auto">Auto (follow DevTools)</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="toggle-row">
            <span>Enable Preview Redesign <em class="preview-badge">beta</em></span>
            <input type="checkbox" id="designPreview" />
          </label>
          <label class="toggle-row">
            <span>Show in-page HUD overlay <em class="preview-badge">beta</em></span>
            <input type="checkbox" id="showHud" />
          </label>
        </div>
      </section>

      <!-- Other Settings -->
      <section class="settings-card">
        <h2 class="settings-card-header">Advanced</h2>
        <div class="settings-card-body">
          <label class="field-row">
            <span>Minimum panel height</span>
            <input class="field-input field-input--narrow" type="number" id="minSize" value="50" />
          </label>
        </div>
      </section>

    </div>
  </body>
</html>
